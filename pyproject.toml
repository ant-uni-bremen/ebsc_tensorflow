[build-system]
requires = ["setuptools>=77.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ebsc_tensorflow"
authors = [{ name = "Johannes Königs", email = "koenigs@ant.uni-bremen.de" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
description = "TensorFlow counterpart of ebsc: differentiable time-warping and time-warped Yen interpolator for event-based sampling."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest", "scipy", "ebsc @ git+https://github.com/ant-uni-bremen/ebsc.git"]
examples = ["matplotlib", "ebsc @ git+https://github.com/ant-uni-bremen/ebsc.git"]

[project.urls]
Source = "https://github.com/ant-uni-bremen/ebsc_tensorflow/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools_scm]
write_to = "src/ebsc_tensorflow/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
